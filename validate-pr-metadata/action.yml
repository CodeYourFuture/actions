name: "Validate PR Metadata"
description: "Validates CodeYourFuture trainee pull request metadata"
inputs:
  GITHUB_TOKEN:
    description: GitHub Token to use, probably secrets.GITHUB_TOKEN
    required: true
  use_dummy_code_of_conduct_validator:
    description: |
      Use the dummy code of conduct validator instead of the real PR metadata validator.
      This should only be used in repos where we're teaching about GitHub Actions comments.
    default: false
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Download Validator
      run: |
        BINARY="pr-metadata-validator"
        if [[ "${USE_DUMMY_CODE_OF_CONDUCT_VALIDATOR}" == "true" ]]; then
          BINARY="dummy-code-of-conduct-validator"
        fi
        gh release -R CodeYourFuture/trainee-tracker view --json assets -q ".assets[] | select(.name | startswith(\"${BINARY}-musl-\")).url" | xargs curl --fail -L -o /tmp/pr-metadata-validator && chmod 0755 /tmp/pr-metadata-validator
      shell: bash
      env:
        USE_DUMMY_CODE_OF_CONDUCT_VALIDATOR: ${{ inputs.use_dummy_code_of_conduct_validator }}
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
    - name: Validate PR Metadata
      run: /tmp/pr-metadata-validator ${{ github.event.pull_request.html_url }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
